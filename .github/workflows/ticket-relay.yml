name: ticket-relay
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = so testa a captura | push = envia o ticket pro bot"
        required: false
        default: "probe"
      push_url:
        description: "URL base do bot (ex: https://xxx.trycloudflare.com)"
        required: false
        default: ""
concurrency:
  group: ticket-relay
  cancel-in-progress: false
jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Capturar ticket via Chrome real (xvfb)
        env:
          TIBIDLE_SESSION: ${{ secrets.TIBIDLE_SESSION }}
          MODE: ${{ inputs.mode }}
          PUSH_URL: ${{ inputs.push_url }}
        run: |
          set -euo pipefail
          if [ -z "$TIBIDLE_SESSION" ]; then
            echo "::error::secret TIBIDLE_SESSION vazio (sid da sessao da VPS)"
            exit 1
          fi
          COOKIE="$TIBIDLE_SESSION"
          echo "cookie sid-only da VPS (${#COOKIE} chars)"
          if [ "$MODE" = "push" ]; then
            if [ -z "$PUSH_URL" ]; then
              echo "::error::mode=push exige push_url"
              exit 1
            fi
            # get_ticket rouba o token Turnstile e ele mesmo faz POST /api/ticket
            # (o valor do token nunca aparece no log do runner)
            xvfb-run -a go run ./cmd/get_ticket -cookies "$COOKIE" -push "$PUSH_URL"
            echo "resultado enviado pro bot em $PUSH_URL"
          else
            OUT=$(xvfb-run -a go run ./cmd/get_ticket -cookies "$COOKIE" -no-push 2>&1 | tee /dev/stderr)
            if printf '%s' "$OUT" | grep -q 'TURNSTILE_TOKEN_LEN:'; then
              echo "token Turnstile capturado (runner so resolve; bot emite na VPS)"
            elif printf '%s' "$OUT" | grep -q 'FRESH_TICKET:'; then
              echo "ticket capturado (modo legado)"
            else
              echo "::error::nem token nem ticket capturados (Turnstile falhou no runner)"
              exit 1
            fi
          fi

