name: ticket-relay
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = so testa a captura | push = envia o ticket pro bot"
        required: false
        default: "probe"
      push_url:
        description: "URL base do bot (ex: https://xxx.trycloudflare.com)"
        required: false
        default: ""
concurrency:
  group: ticket-relay
  cancel-in-progress: false
jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Capturar ticket via Chrome real (xvfb)
        env:
          TIBIDLE_SESSION: ${{ secrets.TIBIDLE_SESSION }}
          MODE: ${{ inputs.mode }}
          PUSH_URL: ${{ inputs.push_url }}
        run: |
          set -euo pipefail
          if [ -z "$TIBIDLE_SESSION" ]; then
            echo "::error::secret TIBIDLE_SESSION vazio (sid da sessao da VPS)"
            exit 1
          fi
          COOKIE="$TIBIDLE_SESSION"
          echo "cookie sid-only da VPS (${#COOKIE} chars)"
          OUT=$(xvfb-run -a go run ./cmd/get_ticket -cookies "$COOKIE" -no-push 2>&1 | tee /dev/stderr)
          TICKET=$(printf '%s' "$OUT" | grep -o 'FRESH_TICKET:.*' | head -1 | cut -d: -f2-)
          WSURL=$(printf '%s' "$OUT" | grep -o 'WS_URL:.*' | head -1 | cut -d: -f2-)
          if [ -z "$TICKET" ]; then
            echo "::error::ticket nao capturado (Turnstile falhou no runner)"
            exit 1
          fi
          echo "ticket capturado ($(printf '%s' "$TICKET" | wc -c) chars)"
          if [ "$MODE" = "push" ]; then
            if [ -z "$PUSH_URL" ]; then
              echo "::error::mode=push exige push_url"
              exit 1
            fi
            curl -fsS -m 15 -X POST "$PUSH_URL/api/ticket" \
              -H 'Content-Type: application/json' \
              -d "{\"ticket\":\"$TICKET\",\"wsUrl\":\"$WSURL\"}"
            echo
            echo "ticket enviado pro bot em $PUSH_URL"
          fi


